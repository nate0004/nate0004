<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" fill="none" role="img" aria-label="Moha — Systems that trade, think, and ship">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#13171F"/>
    </linearGradient>
    <linearGradient id="title" x1="72" y1="120" x2="760" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#D6DDE6"/>
      <stop offset="1" stop-color="#7D8590"/>
    </linearGradient>
    <linearGradient id="curve" x1="745" y1="258" x2="1210" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5E6AD2"/>
      <stop offset="1" stop-color="#3FB950"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="52" x2="0" y2="258" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5E6AD2" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#5E6AD2" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1010 70) rotate(125) scale(300 340)">
      <stop stop-color="#5E6AD2" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#5E6AD2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="330" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="330" rx="14" fill="url(#grid)"/>
  <rect width="1200" height="330" rx="14" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="329" rx="14" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <path d="M745 258 L805 222 L865 240 L925 184 L985 200 L1045 134 L1105 156 L1210 52 L1210 258 Z" fill="url(#area)"/>
  <path d="M745 258 L805 222 L865 240 L925 184 L985 200 L1045 134 L1105 156 L1210 52" stroke="url(#curve)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="72" y="86" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" letter-spacing="4.2" fill="#7D8590">QUANTITATIVE  SYSTEMS &#160;/&#160; AI  ENGINEERING &#160;/&#160; FULL-STACK</text>

  <text x="70" y="158" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="-1.6" fill="url(#title)">Systems that trade,</text>
  <text x="70" y="216" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="-1.6" fill="url(#title)">think, and ship.</text>

  <text x="72" y="252" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" fill="#8B949E">Research &#8594; backtest &#8594; production. End to end, by one engineer.</text>

  <rect x="72" y="274" width="286" height="32" rx="16" fill="#5E6AD2" fill-opacity="0.12" stroke="#5E6AD2" stroke-opacity="0.38"/>
  <circle cx="92" cy="290" r="4" fill="#3FB950"/>
  <circle cx="92" cy="290" r="8" fill="#3FB950" fill-opacity="0.20"/>
  <text x="106" y="295" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" letter-spacing="0.6" fill="#C9D1D9">CURRENTLY BUILDING &#183; KESH QUANT</text>
</svg>
