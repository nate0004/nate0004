<svg xmlns="http://www.w3.org/2000/svg" width="240" height="190" viewBox="0 0 240 190" fill="none" role="img" aria-label="Isometric mark">
  <defs>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(120 80) scale(120)">
      <stop stop-color="#0891B2" stop-opacity="0.13"/><stop offset="1" stop-color="#0891B2" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .rise { animation: rise 5.5s ease-in-out infinite; }
    .spin { animation: spin 4.5s ease-in-out infinite; }
    @keyframes rise { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-8px) } }
    @keyframes spin { 0%,100% { opacity:.35; transform: translate(0,0) } 50% { opacity:1; transform: translate(-7px,-6px) } }
    @media (prefers-reduced-motion: reduce) { .rise,.spin { animation: none } }
  </style>

  <rect width="240" height="190" fill="url(#halo)"/>
  <ellipse cx="120" cy="156" rx="62" ry="10" fill="#4338CA" fill-opacity="0.13"/>

  <g class="rise">
    <g>
      <polygon points="152,32 120,50 120,100 152,82" fill="#137685"/>
      <polygon points="88,32 120,50 120,100 88,82" fill="#0c4c56"/>
      <polygon points="120,14 152,32 120,50 88,32" fill="#26ecff"/>
      <polygon points="120,14 152,32 120,50 88,32" fill="none" stroke="#36ffff" stroke-width="1" stroke-opacity="0.75"/>
    </g>
    <g>
      <polygon points="184,66 152,84 152,118 184,100" fill="#21498a"/>
      <polygon points="120,66 152,84 152,118 120,100" fill="#152f59"/>
      <polygon points="152,48 184,66 152,84 120,66" fill="#4292ff"/>
      <polygon points="152,48 184,66 152,84 120,66" fill="none" stroke="#5ed0ff" stroke-width="1" stroke-opacity="0.75"/>
    </g>
    <g>
      <polygon points="120,72 88,90 88,118 120,100" fill="#2c377d"/>
      <polygon points="56,72 88,90 88,118 56,100" fill="#1c2451"/>
      <polygon points="88,54 120,72 88,90 56,72" fill="#586ffb"/>
      <polygon points="88,54 120,72 88,90 56,72" fill="none" stroke="#7e9eff" stroke-width="1" stroke-opacity="0.75"/>
    </g>
    <g>
      <polygon points="152,100 120,118 120,136 152,118" fill="#373987"/>
      <polygon points="88,100 120,118 120,136 88,118" fill="#242557"/>
      <polygon points="120,82 152,100 120,118 88,100" fill="#6f72ff"/>
      <polygon points="120,82 152,100 120,118 88,100" fill="none" stroke="#9ea3ff" stroke-width="1" stroke-opacity="0.75"/>
    </g>
    <circle class="spin" cx="168" cy="34" r="3" fill="#0E7490"/>
  </g>
</svg>
