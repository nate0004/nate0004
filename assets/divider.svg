<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="36" viewBox="0 0 1200 36" fill="none" role="presentation">
  <defs>
    <linearGradient id="ln" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#6366F1" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#22D3EE" stop-opacity="0.75"/>
      <stop offset="0.75" stop-color="#6366F1" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="pk" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 18) scale(46 18)">
      <stop stop-color="#22D3EE" stop-opacity="0.95"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .pk { animation: run 6.5s cubic-bezier(.45,0,.55,1) infinite; }
    .nd { animation: nd 3.2s ease-in-out infinite; transform-origin: 600px 18px; }
    @keyframes run { 0% { transform: translateX(-60px); opacity:0 } 12%,88% { opacity:1 } 100% { transform: translateX(1260px); opacity:0 } }
    @keyframes nd { 0%,100% { opacity:.55; transform: rotate(45deg) scale(1) } 50% { opacity:1; transform: rotate(45deg) scale(1.18) } }
    @media (prefers-reduced-motion: reduce) { .pk,.nd { animation: none } }
  </style>
  <line x1="0" y1="18" x2="556" y2="18" stroke="url(#ln)" stroke-width="1.1"/>
  <line x1="644" y1="18" x2="1200" y2="18" stroke="url(#ln)" stroke-width="1.1"/>
  <g class="nd">
    <rect x="592" y="10" width="16" height="16" rx="2" transform="rotate(-45 600 18)" fill="none" stroke="#22D3EE" stroke-opacity="0.8" stroke-width="1.2"/>
    <circle cx="600" cy="18" r="2.4" fill="#22D3EE"/>
  </g>
  <ellipse class="pk" cx="0" cy="18" rx="46" ry="9" fill="url(#pk)"/>
</svg>
