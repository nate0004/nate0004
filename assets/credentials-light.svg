      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EEF2FA"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" stroke="#334155" stroke-opacity="0.06" stroke-width="1"/>
