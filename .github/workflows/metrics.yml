## Generates the lowlighter/metrics panels embedded in README.md.
##
## SETUP (one-off):
##   1. Create a classic PAT at https://github.com/settings/tokens
##      Scope: `public_repo` only. Nothing else is needed for these plugins.
##   2. Add it at Settings → Secrets and variables → Actions → New repository secret
##      Name: METRICS_TOKEN
##   3. Run this workflow once from the Actions tab (Run workflow).
##   4. Uncomment the "Signals" block in README.md — the SVGs will exist by then.
##
## NOTE: pinned to v3.34. `lowlighter/metrics@latest` appears throughout the
## project's own docs but no `latest` tag exists on the repo, so it fails to
## resolve. Bump this pin deliberately after checking the tag list.

name: Metrics

on:
  schedule:
    - cron: "0 4 * * *"   # daily, 04:00 UTC
  workflow_dispatch:       # and on demand from the Actions tab

permissions:
  contents: write

jobs:
  panels:
    runs-on: ubuntu-latest
    steps:
      # 3D isometric contribution calendar — the one genuinely dimensional
      # artifact in the metrics project.
      - name: Isometric calendar
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: nate0004
          filename: assets/metrics/isocalendar.svg
          base: ""
          config_timezone: Africa/Algiers
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Language distribution
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: nate0004
          filename: assets/metrics/languages.svg
          base: ""
          config_timezone: Africa/Algiers
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_threshold: 1%
          plugin_languages_colors: github
          plugin_languages_details: percentage

      - name: Coding habits
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: nate0004
          filename: assets/metrics/habits.svg
          base: ""
          config_timezone: Africa/Algiers
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_charts: yes
          plugin_habits_facts: no
